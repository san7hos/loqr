<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local QR Code Generator</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 system-ui, sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; }
    main {
      width: min(100%, 42rem);
      margin: auto;
      padding: clamp(1.25rem, 5vw, 2.5rem);
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem #17203314;
    }
    h1 { margin-top: 0; line-height: 1.2; }
    p { color: #526078; }
    .tabs { display: flex; gap: .5rem; margin: 1.5rem 0; }
    button, input, select, textarea { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: .5rem;
      padding: .7rem 1rem;
      color: #fff;
      background: #2457d6;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #8eafff;
      outline-offset: 2px;
    }
    .tabs button { color: #2457d6; background: #edf2ff; }
    .tabs button[aria-pressed="true"] { color: #fff; background: #2457d6; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 650; }
    textarea, input, select {
      width: 100%;
      border: 1px solid #c9d1df;
      border-radius: .5rem;
      padding: .7rem;
      color: inherit;
      background: #fff;
    }
    .picture-options label {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: .5rem 0;
      font-weight: 400;
    }
    .picture-options input { width: auto; }
    textarea { min-height: 8rem; resize: vertical; }
    .hint { margin: .35rem 0 1rem; font-size: .9rem; }
    .hidden { display: none; }
    form > button { margin-top: 1.25rem; }
    #result { margin-top: 2rem; text-align: center; }
    #qr { width: min(100%, 22rem); height: auto; image-rendering: pixelated; }
    #download {
      display: inline-block;
      margin-top: 1rem;
      border-radius: .5rem;
      padding: .7rem 1rem;
      color: #fff;
      background: #2457d6;
      text-decoration: none;
    }
    #error { color: #a32222; font-weight: 600; }
    .privacy { font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Local QR Code Generator</h1>
    <p>Create a QR code for text, a URL, or a Wi-Fi network. Everything runs in this page; nothing is sent or saved.</p>
    <div class="tabs" role="group" aria-label="QR code type">
      <button type="button" id="text-tab" aria-pressed="true">Text or URL</button>
      <button type="button" id="wifi-tab" aria-pressed="false">Wi-Fi</button>
    </div>

    <form id="form">
      <section id="text-fields">
        <label for="text">Text or URL</label>
        <textarea id="text" autocomplete="off" spellcheck="false" placeholder="Enter text or a URL"></textarea>
      </section>
      <section id="wifi-fields" class="hidden">
        <label for="ssid">Network name (SSID)</label>
        <input id="ssid" type="text" autocomplete="off">
        <label for="security">Security</label>
        <select id="security">
          <option value="WPA">WPA / WPA2</option>
          <option value="WEP">WEP</option>
          <option value="nopass">No password</option>
        </select>
        <label for="password">Network password</label>
        <input id="password" type="password" autocomplete="off">
        <fieldset class="picture-options">
          <legend>Show on the picture</legend>
          <label><input id="show-ssid" type="checkbox"> SSID</label>
          <label><input id="show-password" type="checkbox"> Password</label>
        </fieldset>
        <p class="hint privacy">Your Wi-Fi password is only used to make this QR code and is never stored.</p>
      </section>
      <button type="submit">Generate QR code</button>
    </form>
    <p id="error" role="alert" aria-live="polite"></p>
    <section id="result" class="hidden" aria-label="Generated QR code">
      <div id="qr"></div>
      <a id="download" download="qr-code.svg">Download QR code (SVG)</a>
    </section>
  </main>
  <script>
    "use strict";

    (() => {
      const $ = (id) => document.getElementById(id);
      const textTab = $("text-tab");
      const wifiTab = $("wifi-tab");
      let mode = "text";
      let downloadUrl = null;

      function setMode(next) {
        mode = next;
        textTab.setAttribute("aria-pressed", String(mode === "text"));
        wifiTab.setAttribute("aria-pressed", String(mode === "wifi"));
        $("text-fields").classList.toggle("hidden", mode !== "text");
        $("wifi-fields").classList.toggle("hidden", mode !== "wifi");
        $("error").textContent = "";
      }
      textTab.addEventListener("click", () => setMode("text"));
      wifiTab.addEventListener("click", () => setMode("wifi"));

      const blockDataLengths = [
        [], [19], [34], [55], [80], [108], [68, 68], [78, 78], [97, 97],
        [116, 116], [68, 68, 69, 69]
      ];
      const eccPerBlock = [0, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18];
      const alignmentPositions = [
        [], [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
        [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]
      ];

      function appendBits(bits, value, count) {
        for (let i = count - 1; i >= 0; i--) bits.push((value >>> i) & 1);
      }

      function multiply(a, b) {
        let result = 0;
        let factor = a;
        for (let i = 0; i < 8; i++) {
          if ((b >>> i) & 1) result ^= factor;
          factor <<= 1;
          if (factor & 0x100) factor ^= 0x11d;
        }
        return result;
      }

      function errorCorrection(data, degree) {
        let generator = [1];
        let root = 1;
        for (let i = 0; i < degree; i++) {
          const next = new Array(generator.length + 1).fill(0);
          generator.forEach((coefficient, j) => {
            next[j] ^= coefficient;
            next[j + 1] ^= multiply(coefficient, root);
          });
          generator = next;
          root = multiply(root, 2);
        }
        const remainder = new Array(degree).fill(0);
        for (const byte of data) {
          const factor = byte ^ remainder.shift();
          remainder.push(0);
          for (let i = 0; i < degree; i++) remainder[i] ^= multiply(generator[i + 1], factor);
        }
        return remainder;
      }

      function makeCodewords(bytes, version) {
        const lengths = blockDataLengths[version];
        const dataCapacity = lengths.reduce((sum, length) => sum + length, 0);
        const bits = [];
        appendBits(bits, 4, 4);
        appendBits(bits, bytes.length, version < 10 ? 8 : 16);
        for (const byte of bytes) appendBits(bits, byte, 8);
        if (bits.length > dataCapacity * 8) throw new Error("This content is too long for this QR code.");
        appendBits(bits, 0, Math.min(4, dataCapacity * 8 - bits.length));
        while (bits.length % 8) bits.push(0);
        const data = [];
        for (let i = 0; i < bits.length; i += 8) {
          data.push(bits.slice(i, i + 8).reduce((value, bit) => (value << 1) | bit, 0));
        }
        for (let pad = 0xec; data.length < dataCapacity; pad ^= 0xec ^ 0x11) data.push(pad);

        const blocks = [];
        let offset = 0;
        for (const length of lengths) {
          const block = data.slice(offset, offset + length);
          offset += length;
          blocks.push({ data: block, ecc: errorCorrection(block, eccPerBlock[version]) });
        }
        const result = [];
        for (let i = 0; i < Math.max(...lengths); i++) {
          for (const block of blocks) if (i < block.data.length) result.push(block.data[i]);
        }
        for (let i = 0; i < eccPerBlock[version]; i++) {
          for (const block of blocks) result.push(block.ecc[i]);
        }
        return result;
      }

      function makeMatrix(codewords, version, mask) {
        const size = version * 4 + 17;
        const modules = Array.from({ length: size }, () => new Array(size).fill(false));
        const functionModules = Array.from({ length: size }, () => new Array(size).fill(false));
        const setFunction = (x, y, dark) => {
          modules[y][x] = dark;
          functionModules[y][x] = true;
        };

        function finder(cx, cy) {
          for (let dy = -1; dy <= 7; dy++) {
            for (let dx = -1; dx <= 7; dx++) {
              const x = cx + dx;
              const y = cy + dy;
              if (x >= 0 && x < size && y >= 0 && y < size) {
                const dark = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6 &&
                  (dx === 0 || dx === 6 || dy === 0 || dy === 6 ||
                    (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
                setFunction(x, y, dark);
              }
            }
          }
        }
        finder(0, 0);
        finder(size - 7, 0);
        finder(0, size - 7);

        for (let i = 8; i < size - 8; i++) {
          setFunction(6, i, i % 2 === 0);
          setFunction(i, 6, i % 2 === 0);
        }
        for (const y of alignmentPositions[version]) {
          for (const x of alignmentPositions[version]) {
            if ((x === 6 && y === 6) || (x === size - 7 && y === 6) ||
                (x === 6 && y === size - 7)) continue;
            for (let dy = -2; dy <= 2; dy++) {
              for (let dx = -2; dx <= 2; dx++) {
                setFunction(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
              }
            }
          }
        }

        function drawFormat() {
          const formatData = (1 << 3) | mask;
          let remainder = formatData;
          for (let i = 0; i < 10; i++) remainder = (remainder << 1) ^ (((remainder >>> 9) & 1) * 0x537);
          const format = ((formatData << 10) | remainder) ^ 0x5412;
          const bit = (i) => ((format >>> i) & 1) !== 0;
          for (let i = 0; i <= 5; i++) setFunction(8, i, bit(i));
          setFunction(8, 7, bit(6));
          setFunction(8, 8, bit(7));
          setFunction(7, 8, bit(8));
          for (let i = 9; i < 15; i++) setFunction(14 - i, 8, bit(i));
          for (let i = 0; i < 8; i++) setFunction(size - 1 - i, 8, bit(i));
          for (let i = 8; i < 15; i++) setFunction(8, size - 15 + i, bit(i));
          setFunction(8, size - 8, true);
        }

        if (version >= 7) {
          let remainder = version;
          for (let i = 0; i < 12; i++) remainder = (remainder << 1) ^ (((remainder >>> 11) & 1) * 0x1f25);
          const versionBits = (version << 12) | remainder;
          for (let i = 0; i < 18; i++) {
            const dark = ((versionBits >>> i) & 1) !== 0;
            const a = size - 11 + i % 3;
            const b = Math.floor(i / 3);
            setFunction(a, b, dark);
            setFunction(b, a, dark);
          }
        }
        drawFormat();

        const dataBits = [];
        for (const byte of codewords) appendBits(dataBits, byte, 8);
        let bitIndex = 0;
        let upward = true;
        for (let right = size - 1; right >= 1; right -= 2) {
          if (right === 6) right--;
          for (let vert = 0; vert < size; vert++) {
            const y = upward ? size - 1 - vert : vert;
            for (let j = 0; j < 2; j++) {
              const x = right - j;
              if (!functionModules[y][x]) {
                const value = bitIndex < dataBits.length ? dataBits[bitIndex++] !== 0 : false;
                const invert = [
                  (x + y) % 2 === 0,
                  y % 2 === 0,
                  x % 3 === 0,
                  (x + y) % 3 === 0,
                  (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0,
                  (x * y) % 2 + (x * y) % 3 === 0,
                  ((x * y) % 2 + (x * y) % 3) % 2 === 0,
                  ((x + y) % 2 + (x * y) % 3) % 2 === 0
                ][mask];
                modules[y][x] = value !== invert;
              }
            }
          }
          upward = !upward;
        }
        return { modules, functionModules, drawFormat };
      }

      function penalty(matrix) {
        const size = matrix.length;
        let score = 0;
        function linePenalty(line) {
          let result = 0;
          for (let i = 0; i < line.length;) {
            let end = i + 1;
            while (end < line.length && line[end] === line[i]) end++;
            if (end - i >= 5) result += 3 + end - i - 5;
            i = end;
          }
          const str = line.map((cell) => cell ? "1" : "0").join("");
          for (let i = 0; i <= str.length - 11; i++) {
            const pattern = str.slice(i, i + 11);
            if (pattern === "10111010000" || pattern === "00001011101") result += 40;
          }
          return result;
        }
        for (let y = 0; y < size; y++) score += linePenalty(matrix[y]);
        for (let x = 0; x < size; x++) score += linePenalty(matrix.map((row) => row[x]));
        for (let y = 0; y < size - 1; y++) {
          for (let x = 0; x < size - 1; x++) {
            const color = matrix[y][x];
            if (matrix[y][x + 1] === color && matrix[y + 1][x] === color &&
                matrix[y + 1][x + 1] === color) score += 3;
          }
        }
        const dark = matrix.flat().filter(Boolean).length;
        score += Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5) * 10;
        return score;
      }

      function escapeXml(value) {
        return value.replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&apos;"
        })[character]);
      }

      function createQr(value, annotations = []) {
        const bytes = Array.from(new TextEncoder().encode(value));
        let version = 1;
        for (; version <= 10; version++) {
          const dataBits = 4 + (version < 10 ? 8 : 16) + bytes.length * 8;
          if (dataBits <= blockDataLengths[version].reduce((sum, n) => sum + n, 0) * 8) break;
        }
        if (version > 10) throw new Error("Content is too long. Use up to 271 UTF-8 bytes.");
        const codewords = makeCodewords(bytes, version);
        let best;
        for (let mask = 0; mask < 8; mask++) {
          const candidate = makeMatrix(codewords, version, mask);
          candidate.drawFormat();
          const score = penalty(candidate.modules);
          if (!best || score < best.score) best = { ...candidate, score };
        }
        const quiet = 4;
        const dimension = best.modules.length + quiet * 2;
        let path = "";
        best.modules.forEach((row, y) => row.forEach((dark, x) => {
          if (dark) path += `M${x + quiet},${y + quiet}h1v1h-1z`;
        }));
        const maxLineLength = Math.max(1, Math.floor((dimension - 4) / 1.8));
        const lines = annotations.flatMap(({ label, value: annotation }) => {
          const characters = Array.from(`${label}: ${annotation}`);
          const wrapped = [];
          while (characters.length) wrapped.push(characters.splice(0, maxLineLength).join(""));
          return wrapped;
        });
        const height = dimension + (lines.length ? lines.length * 5 + 2 : 0);
        const text = lines.map((line, index) =>
          `<text x="${dimension / 2}" y="${dimension + 4 + index * 5}" text-anchor="middle" font-family="sans-serif" font-size="3">${escapeXml(line)}</text>`
        ).join("");
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dimension} ${height}" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000" shape-rendering="crispEdges"/>${text}</svg>`;
      }

      function escapeWifi(value) {
        return value.replace(/([\\;,":])/g, "\\$1");
      }

      $("form").addEventListener("submit", (event) => {
        event.preventDefault();
        $("error").textContent = "";
        try {
          let value;
          const annotations = [];
          if (mode === "wifi") {
            const ssid = $("ssid").value;
            const security = $("security").value;
            const password = $("password").value;
            if (!ssid) throw new Error("Enter the network name.");
            if (security !== "nopass" && !password) throw new Error("Enter the network password.");
            value = `WIFI:T:${security};S:${escapeWifi(ssid)};${security === "nopass" ? "" : `P:${escapeWifi(password)};`};`;
            if ($("show-ssid").checked) annotations.push({ label: "SSID", value: ssid });
            if ($("show-password").checked && security !== "nopass") {
              annotations.push({ label: "Password", value: password });
            }
          } else {
            value = $("text").value;
            if (!value) throw new Error("Enter text or a URL.");
          }
          const svg = createQr(value, annotations);
          $("qr").innerHTML = svg;
          if (downloadUrl) URL.revokeObjectURL(downloadUrl);
          downloadUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
          $("download").href = downloadUrl;
          if (mode === "wifi") $("password").value = "";
          $("result").classList.remove("hidden");
        } catch (error) {
          $("result").classList.add("hidden");
          $("error").textContent = error.message;
        }
      });
    })();
  </script>
</body>
</html>
